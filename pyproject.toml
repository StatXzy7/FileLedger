[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileledger"
version = "0.1.0"
description = "Deterministic local file manifests with snapshot, diff, and verify commands."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "FileLedger contributors"}]
dependencies = []

[project.scripts]
fileledger = "fileledger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
